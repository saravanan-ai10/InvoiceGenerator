services:
  - type: web
    name: invoice-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: admin@example.com # Replace with your email in the Render Dashboard
      - key: ADMIN_PASSWORD
        value: admin123 # Replace with a secure password in the Render Dashboard
      # DATABASE_URL and JWT_SECRET are omitted here because you can configure them in your Render environment tab.
