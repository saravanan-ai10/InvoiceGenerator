services:
  - type: web
    name: invoice-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com # Replace with your email after deployment in Render Dashboard
      - key: ADMIN_PASSWORD
        value: admin123 # Replace with a secure password in Render Dashboard
databases:
  - name: invoice-db
    databaseName: invoice
    user: invoice_user
